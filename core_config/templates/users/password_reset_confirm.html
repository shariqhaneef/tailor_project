{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    /* Same styles as above */
    #myVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    .main-content { width: 100%; min-height: 80vh; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(0, 0, 0, 0.4); }
    .form-signin { width: 100%; max-width: 550px; padding: 50px 40px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
    .login-title { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); font-weight: 600; font-size: 2rem; margin-bottom: 1rem; }
    .form-signin input[type="password"] { background: rgba(255, 255, 255, 0.85) !important; border: none !important; padding: 12px 15px !important; border-radius: 8px !important; color: #333 !important; }
    .form-signin label { font-weight: 500; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5); }
    .login-btn { background-color: #e50914 !important; border: none !important; padding: 14px !important; font-size: 1.25rem !important; border-radius: 8px !important; font-weight: bold !important; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4) !important; transition: background-color 0.3s ease, transform 0.2s ease !important; color: white !important; width: 100%; margin-top: 1.5rem; }
    .login-btn:hover { background-color: #f40612 !important; transform: translateY(-2px) !important; }
</style>

<div>
    <video autoplay muted loop id="myVideo"><source src="{% static 'videos/tail.mp4' %}" type="video/mp4"></video>  
    <div class="main-content">
        <main class="form-signin text-center text-white">
            <h3 class="login-title">Set New Password</h3>
            <p class="mb-4 text-light" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">
                Please enter your new password twice so we can verify you typed it in correctly.
            </p>
            <form method="POST" class="text-start">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="login-btn" type="submit">Update Password</button>
            </form>
        </main>
    </div>
</div>
{% endblock %}
