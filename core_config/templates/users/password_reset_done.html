{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    #myVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    .main-content { width: 100%; min-height: 80vh; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(0, 0, 0, 0.4); }
    .form-signin { width: 100%; max-width: 550px; padding: 50px 40px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
    .login-title { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); font-weight: 600; font-size: 2rem; margin-bottom: 1rem; }
    .login-btn { background-color: #e50914 !important; border: none !important; padding: 14px !important; font-size: 1.25rem !important; border-radius: 8px !important; font-weight: bold !important; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4) !important; transition: background-color 0.3s ease, transform 0.2s ease !important; color: white !important; width: 100%; margin-top: 1.5rem; display: inline-block; }
    .login-btn:hover { background-color: #f40612 !important; transform: translateY(-2px) !important; }
</style>

<div>
    <video autoplay muted loop id="myVideo"><source src="https://videos.pexels.com/video-files/8306458/8306458-uhd_2160_4096_25fps.mp4" type="video/mp4"></video>  
    <div class="main-content">
        <main class="form-signin text-center text-white">
            <h3 class="login-title">Email Sent!</h3>
            <p class="mb-4 text-light" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">
                We've emailed you instructions for setting your password. You should receive them shortly. 
                <br><br>
                <em>(Check your terminal window to see the reset link for testing!)</em>
            </p>
            <a href="{% url 'login' %}" class="login-btn text-decoration-none">Back to Login</a>
        </main>
    </div>
</div>
{% endblock %}
